<section x-data="new ExampleListComponent(router, bookmarkApi)" x-init="load()">
  <div class="status-row">
    <button class="top-back-button" type="button" @click="home()">← Home</button>
    <p class="status page-header-status" role="status" aria-live="polite" :class="{ error: isError }"
       x-text="status"></p>
    <label class="page-size-field">
      <span>Page Size</span>
      <select x-model.number="page_size" @change="resize()">
        <option value="1">1</option>
        <option value="4">4</option>
        <option value="10">10</option>
      </select>
    </label>
  </div>
  <section class="results" aria-label="Examples">
    <p class="empty-message" x-show="!isLoading && !isError && !examples.length && emptyMessage"
       x-text="emptyMessage"></p>
    <template x-for="(example, index) in examples" :key="`${example.meaning_id}-${example.sentence}-${index}`">
      <article class="meaning-card example-card" role="button" tabindex="0" @click="openExample(example)"
               @keydown.enter.prevent="openExample(example)" @keydown.space.prevent="openExample(example)">
        <h2 x-html="render(example.sentence)"></h2>
        <div class="replacements-area">
          <button class="replacements-button" type="button" x-show="!showReplacements(example)"
                  @click.stop="toggleReplacements(example)">Replacements 👀</button>
          <p class="replacements-text" x-show="showReplacements(example)" x-text="joinWords(example.replacements)"></p>
        </div>
      </article>
    </template>
  </section>
  <div class="load-more-row" x-show="examples.length">
    <button class="load-more-button" type="button" @click="showNext()" :disabled="isLoading"
            x-text="isLoading ? 'Loading...' : 'Next'"></button>
  </div>
</section>
