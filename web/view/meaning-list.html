<section x-data="new MeaningListComponent(router, meaningApi, bookmarkApi)" x-init="load()">
  <div class="status-row">
    <button class="top-back-button" type="button" @click="home()">← Home</button>
    <p class="status page-header-status" role="status" aria-live="polite" :class="{ error: isError }"
       x-text="status"></p>
  </div>
  <section class="results" :aria-label="label()">
    <p class="empty-message" x-show="!isLoading && !isError && !meanings.length && emptyMessage"
       x-text="emptyMessage"></p>
    <template x-for="(meaning, index) in meanings" :key="meaning.id || `${meaning.query}-${meaning.pos}-${meaning.definition}-${index}`">
      <button class="meaning-card" type="button" @click="openMeaning(meaning)">
        <h2>
          <span x-text="meaning.query"></span><span class="pos" x-text="meaning.pos"></span>
          <template x-for="(tag, index) in userTags(meaning)" :key="tag">
            <span class="pos user-tag" :class="{ 'first-user-tag': index === 0 }" x-text="tag"></span>
          </template>
        </h2>
        <p x-text="meaningText(meaning)"></p>
      </button>
    </template>
  </section>
</section>
