[project]
name = "synogym"
version = "0.1.0"
description = "English synonym finding game to improve recall and paraphrasing skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.3",
    "flask>=3.1.2",
    "google-auth>=2.43.0",
    "openai>=2.8.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
