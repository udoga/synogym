<main class="page" x-data="new LoginComponent(authApi, router)" x-init="load()" x-cloak>
  <section class="top-bar login-top-bar" aria-labelledby="title">
    <h1 id="title">Synogym</h1>
  </section>
  <section class="sign-in-panel" aria-label="Authentication">
    <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
      <button type="button" role="tab" :aria-selected="authMode === 'sign-in'"
              :class="{ active: authMode === 'sign-in' }" @click="setAuthMode('sign-in')">Sign In</button>
      <button type="button" role="tab" :aria-selected="authMode === 'sign-up'"
              :class="{ active: authMode === 'sign-up' }" @click="setAuthMode('sign-up')">Register</button>
    </div>
    <form class="sign-in-form" @submit.prevent="submit()">
      <label for="email-input">Email</label>
      <input id="email-input" name="email" type="email" autocomplete="email" required x-model="email"
             :disabled="isLoading">
      <label for="password-input">Password</label>
      <input id="password-input" name="password" type="password" :autocomplete="passwordAutocomplete()" required
             x-model="password" :disabled="isLoading">
      <button type="submit" :disabled="isLoading" x-text="submitText()"></button>
    </form>
    <div id="google-signin-button" class="google-signin-button"></div>
    <p class="status error" x-show="status" x-text="status"></p>
  </section>
</main>
