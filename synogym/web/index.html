<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synogym</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main class="page">
    <section class="search-panel" aria-labelledby="title">
      <h1 id="title">Synogym</h1>
      <form id="search-form" class="search-form">
        <label class="sr-only" for="query-input">Word</label>
        <input id="query-input" name="query" type="search" placeholder="Search for a word" autocomplete="off" required>
        <button id="search-button" type="submit">Search</button>
      </form>
      <div class="status-row">
        <button id="back-button" class="top-back-button" type="button" hidden>← Back</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section id="results" class="results" aria-label="Meanings"></section>
  </main>
  <script src="/web/app.js"></script>
</body>
</html>
