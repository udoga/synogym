<section x-data="new MeaningDetailComponent(router, meaningApi, bookmarkApi, quoteApi)" x-init="load()">
  <div class="status-row">
    <button class="top-back-button" type="button" @click="back()">← Back</button>
    <p class="status page-header-status" role="status" aria-live="polite" :class="{ error: isError }" x-text="status"></p>
    <button class="top-save-button" type="button" x-show="meaning" :disabled="isLoading" @click="saveBookmark()">
      <span class="save-star" :class="{ saved: bookmark }" x-text="bookmark ? '★' : '☆'"></span>
      <span x-text="bookmark ? 'Saved' : 'Save'"></span>
    </button>
  </div>
  <section class="results" aria-label="Meaning detail">
    <template x-if="meaning">
      <article class="detail-panel">
        <section class="detail-card detail-header">
          <h2>
            <span x-text="meaning.query"></span>
            <span class="pos" x-text="meaning.pos"></span>
            <span x-show="detail().level" class="level-tag" :class="getLevelClass(detail().level)"
                  x-text="detail().level"></span>
            <template x-for="tag in bookmarkTags()" :key="tag">
              <span class="bookmark-inline-tag">
                <span x-text="tag"></span>
                <button type="button" :aria-label="`Remove ${tag}`" @click="removeBookmarkTag(tag)">×</button>
              </span>
            </template>
            <button x-show="!isAddingBookmarkTag" class="bookmark-inline-tag bookmark-add-tag" type="button"
                    aria-label="Add tag"
                    @click="startBookmarkTag(); $nextTick(() => $refs.bookmarkTagInput?.select())">+</button>
            <label class="sr-only" for="bookmark-tag-input">Add a tag...</label>
            <input x-show="isAddingBookmarkTag" x-ref="bookmarkTagInput" id="bookmark-tag-input"
                   class="bookmark-tag-input-tag" type="text" placeholder="Tag Name" enterkeyhint="done"
                   autocapitalize="words" x-model="newBookmarkTag"
                   @keydown.enter.prevent="addBookmarkTag()" @keydown.tab.prevent="addBookmarkTag()"
                   @keydown.escape.prevent="cancelBookmarkTag()" @blur="addBookmarkTag()">
          </h2>
          <p x-text="meaning.definition"></p>
          <label class="sr-only" for="bookmark-note-input">Add a note or example...</label>
          <textarea id="bookmark-note-input" class="detail-note-input" rows="1" placeholder="Add a note or example..."
                    lang="en" inputmode="text" autocomplete="off" autocapitalize="sentences" spellcheck="true"
                    x-model="bookmarkNote" @input.debounce.600ms="updateBookmarkFromNote()"></textarea>
        </section>
        <section class="detail-loader" x-show="isExampleLoading">
          <p class="status">Loading examples...</p>
        </section>
        <section class="detail-card" x-show="hasWords(examples)">
          <h3>Examples</h3>
          <template x-for="example in examples" :key="example.sentence">
            <p>
              <span x-html="render(example.sentence)"></span>
              <br><small x-text="joinWords(example.replacements)"></small>
            </p>
          </template>
        </section>
        <section class="detail-loader" x-show="isDetailLoading">
          <p class="status">Loading detail...</p>
        </section>
        <section class="detail-card" x-show="detail().description">
          <h3>Description</h3><p x-text="detail().description"></p>
        </section>
        <section class="detail-card" x-show="hasWords(detail().synonyms)">
          <h3>Synonyms</h3>
          <p>
            <template x-for="word in detail().synonyms" :key="word">
              <button class="word-button" type="button" @click="searchWord(word)" x-text="word"></button>
            </template>
          </p>
        </section>
        <section class="detail-card" x-show="hasWords(detail().formations)">
          <h3>Formations</h3>
          <p>
            <template x-for="word in detail().formations" :key="word">
              <button class="word-button" type="button" @click="searchWord(word)" x-text="word"></button>
            </template>
          </p>
        </section>
        <section class="detail-card" x-show="detail().history">
          <h3>History</h3><p x-text="detail().history"></p>
        </section>
        <section class="detail-loader" x-show="isQuoteLoading">
          <p class="status">Loading quotes...</p>
        </section>
        <template x-for="quote in quotes" :key="quote.id || `${quote.author}-${quote.text}`">
          <section class="detail-card quote-card">
            <h3>
              <span x-text="quote.author"></span>
              <a class="quote-source" x-show="quote.url" :href="quote.url" target="_blank" rel="noopener noreferrer"
                 aria-label="Open on BrainyQuote">🔗</a>
            </h3>
            <p x-html="render(quote.text)"></p>
          </section>
        </template>
      </article>
    </template>
  </section>
</section>
