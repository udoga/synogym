<section x-data="new ExampleListComponent(router, bookmarkApi)" x-init="load()">
  <div class="status-row">
    <button class="top-back-button" type="button" @click="home()">← Home</button>
    <p class="status page-header-status" role="status" aria-live="polite" :class="{ error: isError }"
       x-text="status"></p>
  </div>
  <section class="results" aria-label="Examples">
    <p class="empty-message" x-show="!isLoading && !isError && !examples.length && emptyMessage"
       x-text="emptyMessage"></p>
    <template x-for="(example, index) in examples" :key="`${example.meaning_id}-${example.sentence}-${index}`">
      <button class="meaning-card example-card" type="button" @click="openExample(example)">
        <h2 x-text="example.sentence"></h2>
        <p x-text="joinWords(example.replacements)"></p>
      </button>
    </template>
  </section>
  <div class="load-more-row" x-show="examples.length">
    <button class="load-more-button" type="button" @click="loadMore()" :disabled="isLoading"
            x-text="isLoading ? 'Loading...' : 'Load More'"></button>
  </div>
</section>
